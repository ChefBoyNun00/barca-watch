<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Barça Watch</title>
  <meta name="description" content="The last 14 days of FC Barcelona videos from 20+ YouTube channels, ranked by what's breaking out, playable right here.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 24'%3E%3Crect width='16' height='24' rx='5' fill='%231b3d96'/%3E%3Crect x='16' width='16' height='24' rx='5' fill='%23a3123f'/%3E%3Crect x='11' width='10' height='24' fill='%23a3123f'/%3E%3Crect x='11' width='5' height='24' fill='%231b3d96'/%3E%3Cpath d='M13 7l8 5-8 5z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@700;800&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="#home" aria-label="Barça Watch home"><span class="mark" aria-hidden="true"><svg viewBox="0 0 10 10"><path d="M1 0l9 5-9 5z"/></svg></span><b>Barça Watch</b></a>
      <label class="search" for="q">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Search players, matches, channels" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <div class="tools">
        <span class="stamp" id="stamp"></span>
        <a class="iconbtn" id="gear" href="#settings" aria-label="Settings" title="Settings (s)"></a>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="shell">
      <nav class="rail" id="rail" aria-label="Sections and channels"></nav>
      <main id="main">
        <nav class="chiprow" id="chips" aria-label="Sections"></nav>
        <div id="view"><p class="loading">Loading the latest Barça videos…</p></div>
      </main>
    </div>
  </div>

  <!-- The player lives outside #view so it keeps playing while you browse. -->
  <div id="dock" class="dock" hidden>
    <div class="dock-bar" id="dock-bar">
      <a class="dock-title" id="dock-title" href="#"></a>
      <button class="dock-btn" id="dock-close" type="button" aria-label="Close player" title="Close player">✕</button>
    </div>
    <div class="dock-frame"><div id="yt"></div></div>
  </div>
  <div id="layer"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
